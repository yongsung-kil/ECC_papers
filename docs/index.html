<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-agent 활용 Prime ECC 개발</title>
<style>
  :root{
    --canvas:#000000;
    --surface-soft:#0d0d0d;
    --surface-card:#1a1a1a;
    --hairline:#3c3c3c;
    --body:#bbbbbb;
    --body-strong:#e6e6e6;
    --muted:#7e7e7e;
    --ink:#ffffff;
    --m-blue-light:#0066b1;
    --m-blue-dark:#1c69d4;
    --m-red:#e22718;
  }
  *, *::before, *::after{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; }
  html{ overflow-x:hidden; }
  body{
    padding-top:4px;
    overflow-x:hidden;
    background:var(--canvas);
    color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-weight:300;
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  /* 맨 위 4px M 3색 띠. 화면에 고정해 항상 보이게 한다 */
  .mstripe{
    position:fixed; top:0; left:0; width:100%; height:4px;
    background:linear-gradient(90deg, var(--m-blue-light) 0 33.33%, var(--m-blue-dark) 33.33% 66.66%, var(--m-red) 66.66% 100%);
    z-index:20;
  }

  /* 왼쪽 사이드바. 너비 260px 고정, 화면에 붙어 따라다닌다 */
  .side{
    position:fixed; top:4px; left:0; bottom:0; width:260px;
    overflow-y:auto;
    background:var(--canvas);
    border-right:1px solid var(--hairline);
    padding:40px 0;
    z-index:10;
  }
  .side-brand{
    color:var(--ink);
    font-size:16px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    padding:0 32px 24px;
    margin:0 0 16px;
    border-bottom:1px solid var(--hairline);
  }
  .nav-group{
    padding:24px 32px 8px;
    color:var(--muted);
    font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  }
  .nav-item{
    display:block; width:100%; box-sizing:border-box;
    padding:10px 32px;
    margin:0; border:0; border-left:2px solid transparent;
    background:transparent;
    color:var(--body);
    font:inherit; font-size:15px; font-weight:400;
    text-align:left; text-decoration:none; cursor:pointer;
  }
  a.nav-item:hover{ color:var(--ink); }
  .nav-item.nav-wip{ color:var(--muted); }
  .nav-item.nav-wip:hover{ color:var(--body); }
  .nav-item.nav-on{
    color:var(--ink);
    border-left-color:var(--ink);
    background:var(--surface-card);
  }

  /* 오른쪽 본문. 사이드바 너비만큼 밀어내고, 안쪽 내용은 1440px에서 가운데 정렬 */
  .main{ margin-left:260px; width:calc(100% - 260px); min-width:0; }
  .screen{ max-width:1440px; margin:0 auto; padding:0 40px; box-sizing:border-box; }

  /* 첫 화면. 제목과 안내 글과 위아래 여백을 합쳐 260px 안쪽으로 잡아
     과제 4에서 붙는 ".screen#top .figure{max-height:calc(100vh - 260px)}"와 맞아떨어지게 한다 */
  .screen#top{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding-top:40px; padding-bottom:40px;
    gap:24px;
  }
  .hero-title{
    margin:0;
    color:var(--ink);
    font-size:56px; font-weight:700; line-height:1.15;
  }
  .screen#top .figure{ width:100%; flex:1 1 auto; min-height:0; }
  .scroll-hint{
    margin:0;
    color:var(--muted);
    font-size:14px; font-weight:400;
  }

  /* 과제 5, 6, 7에서 쓸 에이전트 섹션과 수치 줄. 지금은 쓰이지 않는다 */
  .agent-sec{
    max-width:1440px;
    margin:0 auto;
    padding:96px 40px;
  }
  .sec-title{
    margin:0 0 24px;
    color:var(--ink);
    font-size:40px; font-weight:700;
  }
  .lede{
    margin:0 0 24px;
    color:var(--body-strong);
    font-size:32px; font-weight:400; line-height:1.35;
  }
  .detail{
    margin:0;
    color:var(--body);
    font-size:16px; font-weight:300; line-height:1.7;
  }
  .figure{ width:100%; }
  .stats{ display:flex; flex-wrap:wrap; gap:40px; margin-top:40px; }
  .stat{ display:flex; flex-direction:column; gap:8px; }
  .stat-v{
    color:var(--ink);
    font-size:40px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .stat-l{
    color:var(--muted);
    font-size:14px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  }

  .wip-note {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: var(--surface-card); border: 1px solid var(--hairline);
    color: var(--ink); font-size: 14px; font-weight: 300;
    padding: 12px 24px; opacity: 0; pointer-events: none; transition: opacity .18s;
    z-index:30;
  }
  .wip-note.show { opacity: 1; }

  /* 좁은 화면. 사이드바가 위로 올라가 가로로 눕고, 본문이 가로로 넘치지 않는다 */
  @media (max-width:899px){
    .side{
      position:static; top:auto; left:auto; bottom:auto; width:100%; height:auto;
      overflow-y:visible;
      border-right:0; border-bottom:1px solid var(--hairline);
      display:flex; flex-wrap:wrap; align-items:center;
      gap:4px 8px;
      padding:16px 20px;
    }
    .side-brand{
      width:100%;
      padding:0 0 12px; margin:0 0 4px;
    }
    .nav-group{ padding:8px 12px 4px 0; }
    .nav-item{
      display:inline-block; width:auto;
      padding:8px 12px;
      border-left:0; border-bottom:2px solid transparent;
    }
    .nav-item.nav-on{ background:transparent; border-left:0; border-bottom-color:var(--ink); }
    .main{ margin-left:0; width:100%; }
    .screen{ padding:0 20px; }
    .hero-title{ font-size:36px; }
  }
</style>
</head>
<body>
<div class="mstripe"></div>

<nav class="side">
  <div class="side-brand">PRIME ECC PROJECT</div>
  <a class="nav-item nav-on" data-nav href="#top">개요</a>

  <div class="nav-group">AI AGENT 1</div>
  <button class="nav-item nav-wip" data-nav data-wip type="button">Prime ECC 최적화</button>
  <button class="nav-item nav-wip" data-nav data-wip type="button">성능 결과</button>

  <div class="nav-group">AI AGENT 2</div>
  <button class="nav-item nav-wip" data-nav data-wip type="button">논문과 특허 분석</button>
  <a class="nav-item" data-nav href="papers.html">논문 탐색기 ↗</a>

  <div class="nav-group">AI AGENT 3</div>
  <button class="nav-item nav-wip" data-nav data-wip type="button">아이디어 구현</button>
  <button class="nav-item nav-wip" data-nav data-wip type="button">적용 이력</button>

  <div class="nav-group">종합</div>
  <button class="nav-item nav-wip" data-nav data-wip type="button">로드맵</button>
</nav>

<main class="main">
  <section class="screen" id="top">
    <h1 class="hero-title">AI-agent 활용 Prime ECC 개발</h1>
    <div class="figure" id="mainFigure"></div>
    <div class="scroll-hint">아래로 내리면 에이전트별 설명</div>
  </section>
</main>

<div id="wipNote" class="wip-note"></div>

<script>
document.querySelectorAll("[data-wip]").forEach(function (el) {
  el.addEventListener("click", function () {
    var note = document.getElementById("wipNote");
    note.textContent = "준비 중입니다";
    note.classList.add("show");
    window.clearTimeout(note._timer);
    note._timer = window.setTimeout(function () {
      note.classList.remove("show");
    }, 1600);
  });
});
</script>
</body>
</html>
